<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CueCast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="brand">
      <img src="logo.png" alt="CueCast Logo" class="logo-img" width="36" height="36" />
      <div class="brand-copy">
        <h1>CueCast</h1>
        <p>Chrome Extension</p>
      </div>
    </header>

    <section class="card">
      <p class="intro">Record and replay codeless test steps on real web pages, powered by CueCast.</p>
      <ul class="points">
        <li>Create and manage test cases in CueCast dashboard</li>
        <li>Record, replay, and review results on target pages</li>
      </ul>
    </section>

    <section class="actions">
      <button type="button" class="btn-primary" id="openDashboard">Open Dashboard</button>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
