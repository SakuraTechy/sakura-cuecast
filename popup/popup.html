<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CueCast</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="brand">
      <img src="logo.png" alt="CueCast Logo" class="logo-img" width="36" height="36" />
      <div class="brand-copy">
        <h1>CueCast</h1>
        <p data-i18n="popupSubtitle">Chrome Extension</p>
      </div>
    </header>

    <section class="card">
      <p class="intro" data-i18n="popupIntro">Record and replay codeless test steps on real web pages, powered by CueCast.</p>
      <ul class="points">
        <li data-i18n="popupPointManage">Create and manage test cases in the CueCast dashboard</li>
        <li data-i18n="popupPointRun">Record, replay, and review results on target pages</li>
      </ul>
    </section>

    <section class="actions">
      <label class="field-label" for="platformUrl" data-i18n="popupInstanceAddress">CueCast Instance URL</label>
      <div class="address-row">
        <input id="platformUrl" class="address-input" type="text" inputmode="url" placeholder="http://192.168.1.10:31790" />
        <button type="button" class="btn-secondary" id="savePlatform" data-i18n="popupSave">Save</button>
      </div>
      <p class="hint" id="platformStatus" data-i18n="popupInstanceHint">You can start with an IP address and change it to a domain later.</p>
      <button type="button" class="btn-primary" id="openDashboard" data-i18n="popupOpenDashboard">Open Dashboard</button>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
